name: Weekly Lotto Data Update

on:
  schedule:
    # ===== 1214회 전용: 2026-03-07 토요일 22:50 KST (UTC 13:50) =====
    - cron: '50 13 7 3 6'
    # ===== 1215회부터 평시: 매주 토요일 21:10 KST (UTC 12:10) =====
    # 활성화 시점: 2026-03-14(1215회)부터 아래 줄 주석 해제, 위 1214회 줄 삭제
    # - cron: '10 12 * * 6'
  workflow_dispatch: # 수동 트리거 허용

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 최대 3시간 (10분×6=1시간 + TV편성표 확인 대기 + 추가 재시도)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas openpyxl

      - name: Run auto-update (10min interval, TV delay detection)
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          # 설정
          PHASE1_RETRIES=6        # 1단계: 10분×6 = 1시간 시도
          PHASE2_RETRIES=12       # 2단계: TV편성표 지연 감지 후 1시간 추가 시도
          ATTEMPT=0
          SUCCESS=false
          TV_CHECKED=false

          echo "================================================"
          echo "로또 자동 업데이트 시작: $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "================================================"

          # ===== 1단계: 기본 시도 (최대 6회 = 1시간) =====
          while [ $ATTEMPT -lt $PHASE1_RETRIES ] && [ "$SUCCESS" = "false" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo ""
            echo "--- [1단계 시도 $ATTEMPT/$PHASE1_RETRIES] $(date '+%H:%M:%S UTC') ---"

            if python auto_update.py; then
              SUCCESS=true
              echo "✅ 업데이트 성공! (1단계 시도 $ATTEMPT)"
            else
              echo "❌ 실패 - 아직 발표 전이거나 데이터 없음"
              if [ $ATTEMPT -lt $PHASE1_RETRIES ]; then
                echo "⏳ 10분 후 재시도..."
                sleep 600
              fi
            fi
          done

          # ===== 2단계: 1시간 실패 시 TV편성표 확인 =====
          if [ "$SUCCESS" = "false" ]; then
            echo ""
            echo "================================================"
            echo "⚠️  1단계 1시간 실패 → TV편성표 지연 감지 확인 중..."
            echo "================================================"
            python - << 'PYCHECK'
          import requests
          from bs4 import BeautifulSoup
          import re, sys
          headers = {"User-Agent": "Mozilla/5.0", "Accept-Language": "ko-KR,ko;q=0.9"}
          try:
              q = "KBS2 토요일 TV편성표 로또"
              r = requests.get(f"https://search.naver.com/search.naver?query={requests.utils.quote(q)}", headers=headers, timeout=15)
              text = BeautifulSoup(r.text, "html.parser").get_text()
              delay_words = ["중계", "특집", "올림픽", "월드컵", "야구", "축구", "농구"]
              found = [w for w in delay_words if w in text]
              if found:
                  print(f"DELAY_DETECTED: {found}")
                  sys.exit(2)
              else:
                  print("NO_DELAY: 정상 편성 확인")
                  sys.exit(0)
          except Exception as e:
              print(f"CHECK_FAILED: {e}")
              sys.exit(0)
          PYCHECK

            TV_EXIT=$?
            if [ $TV_EXIT -eq 2 ]; then
              echo "📺 TV 중계로 인한 로또 발표 지연 감지!"
              echo "⏳ 60분 추가 대기 후 재시도 (발표 시간 + 30분 기준)..."
              sleep 3600
            else
              echo "📺 정상 편성 - 데이터 미발표 상태로 계속 재시도"
              echo "⏳ 10분 대기..."
              sleep 600
            fi

            # ===== 2단계 추가 재시도 =====
            ATTEMPT2=0
            while [ $ATTEMPT2 -lt $PHASE2_RETRIES ] && [ "$SUCCESS" = "false" ]; do
              ATTEMPT2=$((ATTEMPT2 + 1))
              echo ""
              echo "--- [2단계 시도 $ATTEMPT2/$PHASE2_RETRIES] $(date '+%H:%M:%S UTC') ---"

              if python auto_update.py; then
                SUCCESS=true
                echo "✅ 업데이트 성공! (2단계 시도 $ATTEMPT2)"
              else
                echo "❌ 실패"
                if [ $ATTEMPT2 -lt $PHASE2_RETRIES ]; then
                  echo "⏳ 10분 후 재시도..."
                  sleep 600
                fi
              fi
            done
          fi

          if [ "$SUCCESS" = "false" ]; then
            echo ""
            echo "================================================"
            echo "❌ 모든 시도 실패. 수동 업데이트 필요."
            echo "================================================"
            exit 1
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add lotto_data.json lotto_data.js lotto_history.json
          git diff --staged --quiet || git commit -m "Data: Weekly update - $(date '+%Y-%m-%d %H:%M UTC')"
          git push
