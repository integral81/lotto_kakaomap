name: Weekly Lotto Data Update

on:
  schedule:
    # 매주 토요일 21:10 KST (UTC 12:10) 기본 실행
    - cron: '10 12 * * 6'
    # 매주 일요일 09:00 KST (UTC 00:00) 토요일 실패 대비 재시도
    - cron: '0 0 * * 0'
    # 매주 월요일 09:00 KST (UTC 00:00) 최후의 보루 재시도
    - cron: '0 0 * * 1'
  workflow_dispatch: # 수동 트리거 허용

# 동시 실행 방지
concurrency:
  group: lotto-weekly-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 최대 3시간 (10분×18회 재시도)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas openpyxl certifi

      - name: Run auto-update (Supabase 직접 저장, 10분 간격 재시도)
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          PHASE1_RETRIES=6
          PHASE2_RETRIES=12
          ATTEMPT=0
          SUCCESS=false

          echo "================================================"
          echo "로또 자동 업데이트 시작: $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "================================================"

          # 1단계: 기본 시도 (10분×6 = 1시간)
          while [ $ATTEMPT -lt $PHASE1_RETRIES ] && [ "$SUCCESS" = "false" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo ""
            echo "--- [1단계 $ATTEMPT/$PHASE1_RETRIES] $(date '+%H:%M:%S UTC') ---"
            if python auto_update.py; then
              SUCCESS=true
              echo "✅ 업데이트 성공!"
            else
              echo "❌ 실패 - 아직 미발표 상태"
              [ $ATTEMPT -lt $PHASE1_RETRIES ] && echo "⏳ 10분 후 재시도..." && sleep 600
            fi
          done

          # 2단계: TV 편성 지연 확인 후 추가 재시도
          if [ "$SUCCESS" = "false" ]; then
            echo ""
            echo "⚠️  1시간 실패 → TV편성표 지연 확인 중..."
            python - << 'PYCHECK'
          import requests
          from bs4 import BeautifulSoup
          import sys
          headers = {"User-Agent": "Mozilla/5.0", "Accept-Language": "ko-KR,ko;q=0.9"}
          try:
              r = requests.get("https://search.naver.com/search.naver?query=KBS2+토요일+TV편성표+로또", headers=headers, timeout=15)
              text = BeautifulSoup(r.text, "html.parser").get_text()
              found = [w for w in ["중계","특집","올림픽","월드컵","야구","축구","농구"] if w in text]
              if found:
                  print(f"DELAY_DETECTED: {found}")
                  sys.exit(2)
              else:
                  print("NO_DELAY: 정상 편성")
                  sys.exit(0)
          except Exception as e:
              print(f"CHECK_FAILED: {e}")
              sys.exit(0)
          PYCHECK

            TV_EXIT=$?
            if [ $TV_EXIT -eq 2 ]; then
              echo "📺 TV 중계 지연 감지 → 60분 추가 대기..."
              sleep 3600
            else
              echo "📺 정상 편성 → 10분 대기..."
              sleep 600
            fi

            ATTEMPT2=0
            while [ $ATTEMPT2 -lt $PHASE2_RETRIES ] && [ "$SUCCESS" = "false" ]; do
              ATTEMPT2=$((ATTEMPT2 + 1))
              echo ""
              echo "--- [2단계 $ATTEMPT2/$PHASE2_RETRIES] $(date '+%H:%M:%S UTC') ---"
              if python auto_update.py; then
                SUCCESS=true
                echo "✅ 업데이트 성공!"
              else
                echo "❌ 실패"
                [ $ATTEMPT2 -lt $PHASE2_RETRIES ] && echo "⏳ 10분 후 재시도..." && sleep 600
              fi
            done
          fi

          if [ "$SUCCESS" = "false" ]; then
            echo ""
            echo "❌ 모든 시도 실패. 수동 업데이트가 필요합니다."
            exit 1
          fi
